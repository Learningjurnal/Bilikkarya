      <button class="btn-primary" id="submitThread">${t('submit_thread_btn')}</button>
    </div>
  `;
  activateOverlay('threadFormOverlay');
  wireEditorToolbar(el.querySelector('[data-for="newThreadEditor"]'), document.getElementById('newThreadEditor'), document.getElementById('newThreadCounter'), THREAD_MAX_CHARS);
  const catSelect = document.getElementById('newThreadCat');
  const regionField = document.getElementById('newThreadRegionField');
  const regionSelectEl = document.getElementById('newThreadRegion');
  const syncRegionVisibility = ()=>{
    const cat = catSelect.value;
    const isKhusus = scopeOfCat(cat)==='khusus';
    const show = cat==='Jual-Beli Antar Member' || isKhusus;
    regionField.style.display = show ? '' : 'none';
    if(isKhusus){
      regionSelectEl.innerHTML = `<option value="">${t('field_region_none')}</option>` + FORUM_SETTINGS.khususRegions.map(r=>`<option value="${escapeHtml(r.name)}">${escapeHtml(r.name)}</option>`).join('');
    } else {
      regionSelectEl.innerHTML = `<option value="">${t('field_region_none')}</option>` + REGIONS.map(r=>`<option value="${r}">${REGION_FLAG[r]} ${r}</option>`).join('');
    }
  };
  syncRegionVisibility();
  catSelect.onchange = syncRegionVisibility;
  catSelect.disabled = !!opts.productId;
  function renderPreview(){
    const box = document.getElementById('newThreadAttachPreview');
    if(!attachment){ box.innerHTML=''; return; }
    if(attachment.type==='image'){ box.innerHTML = `<div class="attach-thumb"><img src="${attachment.data}" alt=""><button class="rm" id="rmNewAttach" aria-label="${t('attach_remove_label')}">✕</button></div>`; }
    else { box.innerHTML = `<div class="video-chip">🎬 ${escapeHtml(attachment.name)} <button class="rm" id="rmNewAttach" style="position:static;" aria-label="${t('attach_remove_label')}">✕</button></div>`; }
    document.getElementById('rmNewAttach').onclick = ()=>{ attachment=null; renderPreview(); };
  }
  document.getElementById('newThreadImgInput').onchange = async (e)=>{ const f=e.target.files[0]; if(!f) return; attachment={type:'image', data: await resizeImageFile(f,640)}; renderPreview(); };
  document.getElementById('newThreadVidInput').onchange = (e)=>{ const f=e.target.files[0]; if(!f) return; attachment={type:'video', name:f.name, sessionUrl:URL.createObjectURL(f)}; renderPreview(); };
  document.getElementById('closeThreadForm').onclick = ()=>deactivateOverlay('threadFormOverlay');
  document.getElementById('submitThread').onclick = async ()=>{
    const title = document.getElementById('newThreadTitle').value.trim();
    const author = resolveAuthorName('newThreadAuthor');
    if(isBlocked(author)){ toast(t('toast_blocked_post'), 'error'); return; }
    const cat = opts.presetCat || document.getElementById('newThreadCat').value;
    if(scopeOfCat(cat)==='khusus' && !isApprovedMember(author) && !adminMode){ toast(t('toast_member_not_approved'), 'error'); return; }
    const editorEl = document.getElementById('newThreadEditor');
    if(editorEl.textContent.length > THREAD_MAX_CHARS){ toast(t('toast_thread_too_long',{max:THREAD_MAX_CHARS}), 'error'); return; }
    const html = sanitizeHtml(editorEl.innerHTML);
    const plain = editorEl.textContent.trim();
    if(!title || !plain){ toast(t('toast_thread_required'), 'error'); return; }
    const region = (cat==='Jual-Beli Antar Member' || scopeOfCat(cat)==='khusus') ? (document.getElementById('newThreadRegion').value || null) : null;
    const newThread = {id:'t'+Date.now(), title, cat, author, pinned:false, status: opts.productId ? 'approved' : 'pending', bodyHtml:html, ts:Date.now(), media:attachment, region, productId: opts.productId||null};
    threadsCache.push(newThread);
    await sSet('forum-threads', threadsCache, true);
    deactivateOverlay('threadFormOverlay');
    toast(t('toast_thread_sent'), 'success');
    renderHeadStats();
    if(opts.onSuccess) opts.onSuccess(newThread); else renderForum();
  };
}

/* ---------------- admin panel ---------------- */
let adminUserSearch = '';
let adminThreadSearch = '';
/* ---------------- Link Monitor: tabel link inti ---------------- */
let LM_DATA = [];
let LM_SETTINGS = { regions:[], outputs:[] };
const LM_CAT_PALETTE = { violet:'#818cf8', green:'#34d399', amber:'#fbbf24', red:'#f87171', blue:'#60a5fa', pink:'#f472b6', gray:'#9090b0' };
let lmLoaded = false;
let lmFilters = { q:'', status:'', region:'', part:'' };
let lmSort = '';
let lmPage = 1;
const LM_PAGE_SIZE = 25;
let lmEditId = null, lmDeleteId = null, lmBulkDeleteMode = false;
const lmSelected = new Set();
const lmUndoStack = [];
const LM_UNDO_MAX = 15;
let lmChartVisible = true;
let lmImportRows = null;
const LM_STATUS = {
  uncomplete:{label:'Uncomplete', color:'--lm-muted'},
  complete:{label:'Complete', color:'--lm-green'},
  lost:{label:'Lost File', color:'--lm-red'},
  skip:{label:'Skip', color:'--lm-amber'},
  broken:{label:'Broken Link', color:'--lm-red'},
  blank:{label:'Blank', color:'--lm-muted'}
};
function lmFmtDate(ms){ return ms ? new Date(ms).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) : '—'; }
async function lmLoad(){
  if(lmLoaded) return;
  try{ const d = await sGet('links-core', true); LM_DATA = Array.isArray(d) ? d : []; }
  catch(_){ LM_DATA = []; }
  try{ const s = await sGet('links-settings', true); if(s) LM_SETTINGS = s; }
  catch(_){ /* keep defaults */ }
  lmLoaded = true;
}
async function lmSaveSettings(){ await sSet('links-settings', LM_SETTINGS, true); }
function lmCatColor(list, name){ const found = list.find(x=>x.name===name); return found ? (LM_CAT_PALETTE[found.color]||LM_CAT_PALETTE.gray) : LM_CAT_PALETTE.gray; }
async function lmPersist(){
  try{ await sSet('links-core', LM_DATA, true); return true; }
  catch(_){ toast('Gagal menyimpan ke Supabase', 'error'); return false; }
}
function lmView(){
  const q = lmFilters.q.trim().toLowerCase();
  let arr = LM_DATA.filter(r=>{
    if(lmFilters.status && r.status!==lmFilters.status) return false;
    if(lmFilters.region && r.region!==lmFilters.region) return false;
    if(lmFilters.part && r.part!==lmFilters.part) return false;
    if(q && !((r.link||'').toLowerCase().includes(q) || (r.note||'').toLowerCase().includes(q))) return false;
    return true;
  });
  if(lmSort==='link-asc') arr.sort((a,b)=>(a.link||'').localeCompare(b.link||''));
  else if(lmSort==='link-desc') arr.sort((a,b)=>(b.link||'').localeCompare(a.link||''));
  else if(lmSort==='date-desc') arr.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  else if(lmSort==='date-asc') arr.sort((a,b)=>(a.updatedAt||0)-(b.updatedAt||0));
  return arr;
}
function lmRenderKPI(){
  const total = LM_DATA.length;
  const complete = LM_DATA.filter(r=>r.status==='complete').length;
  const broken = LM_DATA.filter(r=>r.status==='broken'||r.status==='lost').length;
  const pending = total - complete - broken;
  const el = document.getElementById('lmKpiRow');
  if(!el) return;
  el.innerHTML = [
    ['Total Link', total, '--lm-text'],
    ['Complete', complete, '--lm-green'],
    ['Bermasalah', broken, '--lm-red'],
    ['Belum Selesai', pending, '--lm-amber'],
  ].map(([label,val,color])=>`
    <div class="lm-kpi"><b style="color:var(${color})">${val}</b><span>${label}</span></div>
  `).join('');
}
function lmRenderFilterOptions(){
  const fRegion = document.getElementById('lmFRegion'), fPart = document.getElementById('lmFPart');
  if(fRegion) fRegion.innerHTML = `<option value="">Semua Region</option>` + LM_SETTINGS.regions.map(r=>`<option value="${escapeHtml(r.name)}"${lmFilters.region===r.name?' selected':''}>${escapeHtml(r.name)}</option>`).join('');
  if(fPart) fPart.innerHTML = `<option value="">Semua Output</option>` + LM_SETTINGS.outputs.map(p=>`<option value="${escapeHtml(p.name)}"${lmFilters.part===p.name?' selected':''}>${escapeHtml(p.name)}</option>`).join('');
}
function lmRenderTable(){
  const view = lmView();
  const totalPages = Math.max(1, Math.ceil(view.length/LM_PAGE_SIZE));
  if(lmPage>totalPages) lmPage = totalPages;
  const pageRows = view.slice((lmPage-1)*LM_PAGE_SIZE, lmPage*LM_PAGE_SIZE);
  const tbody = document.getElementById('lmTbody');
  const countInfo = document.getElementById('lmCountInfo');
  if(countInfo) countInfo.textContent = view.length+' link';
  if(!tbody) return;
  if(!pageRows.length){
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:28px;color:var(--lm-muted)">${LM_DATA.length?'Tidak ada hasil sesuai filter.':'Belum ada link. Klik "Tambah Link" atau "Import" untuk mulai.'}</td></tr>`;
  } else {
    tbody.innerHTML = pageRows.map((r,idx)=>{
      const st = LM_STATUS[r.status] || LM_STATUS.blank;
      const isSel = lmSelected.has(r.id);
      return `<tr data-lmid="${r.id}"${isSel?' style="background:rgba(129,140,248,.08)"':''}>
        <td><input type="checkbox" class="lm-cb" data-lmchk="${r.id}"${isSel?' checked':''}></td>
        <td>${(lmPage-1)*LM_PAGE_SIZE+idx+1}</td>
        <td class="lm-link-cell"><a href="${escapeHtml(r.link||'#')}" target="_blank" rel="noopener">${escapeHtml(r.link||'(kosong)')}</a>${r._dup?' <span class="lm-badge" style="color:var(--lm-amber);border-color:var(--lm-amber)">Duplikat</span>':''}</td>
        <td><span class="lm-badge" style="color:var(${st.color});border-color:var(${st.color})">${st.label}</span></td>
        <td>${r.part ? `<span class="lm-badge" style="color:${lmCatColor(LM_SETTINGS.outputs,r.part)};border-color:${lmCatColor(LM_SETTINGS.outputs,r.part)}">${escapeHtml(r.part)}</span>` : '—'}</td>
        <td>${r.region ? `<span class="lm-badge" style="color:${lmCatColor(LM_SETTINGS.regions,r.region)};border-color:${lmCatColor(LM_SETTINGS.regions,r.region)}">${escapeHtml(r.region)}</span>` : '—'}</td>
        <td>${lmFmtDate(r.updatedAt)}</td>
        <td class="lm-actions">
          <button class="lm-iconbtn" data-lmedit="${r.id}" title="Edit">✎</button>
          <button class="lm-iconbtn danger" data-lmdel="${r.id}" title="Hapus">🗑</button>
        </td>
      </tr>`;
    }).join('');
  }
  const pager = document.getElementById('lmPager');
  if(pager){
    pager.innerHTML = totalPages<=1 ? '' : Array.from({length:totalPages},(_,i)=>i+1).map(p=>
      `<button class="lm-pg${p===lmPage?' active':''}" data-lmpage="${p}">${p}</button>`
    ).join('');
  }
}
function lmRenderChart(){
  const wrap = document.getElementById('lmChartWrap');
  if(!wrap) return;
  wrap.style.display = lmChartVisible ? '' : 'none';
  if(!lmChartVisible) return;
  const byRegion = {};
  LM_DATA.forEach(r=>{ const k = r.region||'(tanpa region)'; byRegion[k]=(byRegion[k]||0)+1; });
  const entries = Object.entries(byRegion).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max = Math.max(1, ...entries.map(e=>e[1]));
  document.getElementById('lmChartTotal').textContent = LM_DATA.length+' total';

      <div class="lm-chart-bar-track"><div class="lm-chart-bar" style="width:${(val/max*100).toFixed(0)}%"></div></div>
      <span class="lm-chart-val">${val}</span>
    </div>`).join('') : `<span style="color:var(--lm-muted);font-size:12px">Belum ada data.</span>`;
}
function lmMarkDuplicates(){
  const seen = {};
  LM_DATA.forEach(r=>{ const k=(r.link||'').trim().toLowerCase(); if(!k) return; (seen[k]=seen[k]||[]).push(r); });
  let dupCount = 0;
  LM_DATA.forEach(r=>r._dup=false);
  Object.values(seen).forEach(group=>{ if(group.length>1){ group.forEach(r=>r._dup=true); dupCount+=group.length; } });
  lmRenderTable();
  toast(dupCount ? `${dupCount} link duplikat ditemukan & ditandai` : 'Tidak ada link duplikat', dupCount?'error':'success');
}
function lmSelectDuplicates(){

function lmPushUndo(){

async function lmUndo(){
  const prev = lmUndoStack.pop();
  if(!prev) return;
  LM_DATA = prev;
  await lmPersist();
  lmSelected.clear();
  lmRenderAll();
  const btn = document.getElementById('lmUndoBtn');
  if(btn) btn.disabled = lmUndoStack.length===0;
  toast('Perubahan terakhir dibatalkan', 'success');
}

function lmExportXlsx(){
  if(!LM_DATA.length){ toast('Tidak ada data untuk diekspor', 'error'); return; }
  const headers = ['Link','Status','Output','Region','Catatan','Diperbarui'];
  const aoa = [headers, ...LM_DATA.map(r=>[r.link||'', (LM_STATUS[r.status]||{}).label||r.status||'', r.part||'', r.region||'', r.note||'', lmFmtDate(r.updatedAt)])];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:40},{wch:14},{wch:16},{wch:14},{wch:30},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Link Monitor');
  XLSX.writeFile(wb, 'link-monitor-'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Diekspor ke XLSX', 'success');
}
function lmParseLinksFromText(txt){
  return txt.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>{
    const parts = line.split(/\t|,(?=\S)/).map(s=>s.trim());
    return { link: parts[0]||'', status: (parts[1]||'').toLowerCase() in LM_STATUS ? parts[1].toLowerCase() : 'uncomplete', part: parts[2]||'', region: parts[3]||'' };
  }).filter(r=>r.link && isSafeUrl(r.link));
}

function lmHandleImportRows(rows){
  lmImportRows = rows;
  document.getElementById('lmImportPreview').textContent = rows.length ? `${rows.length} link siap diimport.` : 'Tidak ada baris valid ditemukan.';
  document.getElementById('lmImportDoBtn').disabled = !rows.length;
}
function lmReadImportFile(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(ext==='csv' || ext==='txt'){
    const reader = new FileReader();
    reader.onload = () => lmHandleImportRows(lmParseLinksFromText(String(reader.result)));
    reader.readAsText(file);
  } else {
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const wb = XLSX.read(new Uint8Array(reader.result), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const matrix = XLSX.utils.sheet_to_json(ws, {header:1});
        const rows = matrix.slice(1).map(row=>({
          link: String(row[0]||'').trim(),
          status: String(row[1]||'').toLowerCase() in LM_STATUS ? String(row[1]).toLowerCase() : 'uncomplete',
          part: String(row[2]||'').trim(),
          region: String(row[3]||'').trim()
        })).filter(r=>r.link && isSafeUrl(r.link));
        lmHandleImportRows(rows);
      }catch(e){ toast('Gagal membaca file', 'error'); }
    };
    reader.readAsArrayBuffer(file);
  }
}
async function lmDoImport(){
  if(!lmImportRows || !lmImportRows.length) return;
  lmPushUndo();
  const now = Date.now();
  const existing = new Set(LM_DATA.map(r=>(r.link||'').trim().toLowerCase()));
  let added = 0, skipped = 0;
  lmImportRows.forEach(r=>{
    const key = r.link.trim().toLowerCase();
    if(existing.has(key)){ skipped++; return; }
    existing.add(key);
    LM_DATA.unshift({ id:'lm_'+now.toString(36)+Math.random().toString(36).slice(2,8)+added, link:r.link, status:r.status||'uncomplete', part:r.part||'', region:r.region||'', note:'', inputAt:now, updatedAt:now });
    added++;
  });
  await lmPersist();
  lmCloseImport();
  lmRenderAll();
  toast(`Import selesai — ${added} ditambah${skipped?', '+skipped+' dilewati (duplikat)':''}`, 'success');
}

function isSafeUrl(url){ return /^https?:\/\//i.test((url||'').trim()); }
async function lmSaveLinkForm(){
  const link = document.getElementById('lmFLink').value.trim();
  if(!link){ toast('Link tidak boleh kosong', 'error'); return; }
  if(!isSafeUrl(link)){ toast('Link harus diawali http:// atau https://', 'error'); return; }
  const now = Date.now();
  if(lmEditId){
    const r = LM_DATA.find(x=>x.id===lmEditId);
    if(r){
      r.link = link;
      r.status = document.getElementById('lmFStatusInput').value;
      r.part = document.getElementById('lmFPartInput').value.trim();
      r.region = document.getElementById('lmFRegionInput').value.trim();
      r.note = document.getElementById('lmFNote').value.trim();
      r.updatedAt = now;
    }
  } else {
    LM_DATA.unshift({
      id: 'lm_'+now.toString(36)+Math.random().toString(36).slice(2,8),
      link, status: document.getElementById('lmFStatusInput').value,
      part: document.getElementById('lmFPartInput').value.trim(),
      region: document.getElementById('lmFRegionInput').value.trim(),
      note: document.getElementById('lmFNote').value.trim(),
      inputAt: now, updatedAt: now
    });

  const ok = await lmPersist();
  lmCloseModal();
  lmRenderAll();
  if(ok) toast(lmEditId?'Link diperbarui':'Link ditambahkan', 'success');
}
function lmAskDelete(id){ lmDeleteId = id; lmBulkDeleteMode = false; document.getElementById('lmConfirmOverlay').classList.add('show'); }
async function lmDoDelete(){
  lmPushUndo();

    LM_DATA = LM_DATA.filter(r=>!lmSelected.has(r.id));

  } else {

async function lmAddCat(kind){
  const nameEl = document.getElementById(kind==='output'?'lmNewOutputName':'lmNewRegionName');
  const colorEl = document.getElementById(kind==='output'?'lmNewOutputColor':'lmNewRegionColor');
  const name = nameEl.value.trim();
  if(!name) return;
  const list = kind==='output' ? LM_SETTINGS.outputs : LM_SETTINGS.regions;
  if(list.some(x=>x.name.toLowerCase()===name.toLowerCase())){ toast('Nama itu sudah ada', 'error'); return; }

function lmWire(container){
  if(container.dataset.wired) return;
  container.dataset.wired = '1';
  container.addEventListener('click', e=>{
    if(e.target.closest('#lmAddBtn')) return lmOpenAdd();
    if(e.target.closest('#lmModalClose') || e.target.closest('#lmModalCancel')) return lmCloseModal();
    if(e.target===document.getElementById('lmModalOverlay')) return lmCloseModal();
    if(e.target.closest('#lmModalSave')) return lmSaveLinkForm();
    const editId = e.target.closest('[data-lmedit]')?.dataset.lmedit;
    if(editId) return lmOpenEdit(editId);
    const delId = e.target.closest('[data-lmdel]')?.dataset.lmdel;
    if(delId) return lmAskDelete(delId);
    if(e.target.closest('#lmConfirmDelBtn')) return lmDoDelete();
    if(e.target.closest('#lmConfirmCancelBtn') || e.target===document.getElementById('lmConfirmOverlay')){
      document.getElementById('lmConfirmOverlay').classList.remove('show'); lmDeleteId=null; lmBulkDeleteMode=false; return;
    }
    const pg = e.target.closest('[data-lmpage]')?.dataset.lmpage;
    if(pg){ lmPage = +pg; return lmRenderTable(); }
    if(e.target.closest('#lmChartToggle')){ lmChartVisible = !lmChartVisible; return lmRenderChart(); }
    if(e.target.closest('#lmUndoBtn')) return lmUndo();
    if(e.target.closest('#lmDupBtn')) return lmSelectDuplicates();
    if(e.target.closest('#lmOpenAllBtn')) return lmOpenAllSelected();
    if(e.target.closest('#lmSelClear')) return lmClearSelection();
    if(e.target.closest('#lmSelAllPage')) return lmSelectAllOnPage();
    if(e.target.id==='lmChkAll') return lmSelectAllOnPage();
    if(e.target.closest('#lmSelDelete')) return lmBulkDeleteSelected();
    if(e.target.closest('#lmBulkApplyBtn')) return lmBulkStatusApply();
    if(e.target.closest('#lmExportBtn')) return lmExportXlsx();
    if(e.target.closest('#lmImportBtn')) return lmOpenImport();
    if(e.target.closest('#lmImportClose') || e.target.closest('#lmImportCancel')) return lmCloseImport();
    if(e.target===document.getElementById('lmImportOverlay')) return lmCloseImport();
    if(e.target.closest('#lmImportDoBtn')) return lmDoImport();
    if(e.target.closest('#lmImportDrop')) return document.getElementById('lmImportFile').click();
    if(e.target.closest('#lmCatMgrBtn')) return lmOpenCatMgr();
    if(e.target.closest('#lmCatMgrClose') || e.target.closest('#lmCatMgrDoneBtn')) return lmCloseCatMgr();
    if(e.target===document.getElementById('lmCatMgrOverlay')) return lmCloseCatMgr();
    if(e.target.closest('#lmAddOutputBtn')) return lmAddCat('output');
    if(e.target.closest('#lmAddRegionBtn')) return lmAddCat('region');
    const delCat = e.target.closest('[data-lmcatdel]')?.dataset.lmcatdel;
    if(delCat){ const [kind,idx] = delCat.split(':'); return lmDeleteCat(kind, +idx); }
  });
  container.addEventListener('input', e=>{
    if(e.target.id==='lmSearch'){ lmFilters.q = e.target.value; lmPage=1; lmRenderTable(); }
    if(e.target.id==='lmImportPaste'){
      const v = e.target.value.trim();
      if(v.length>3) lmHandleImportRows(lmParseLinksFromText(v));
      else { lmImportRows=null; document.getElementById('lmImportPreview').textContent=''; document.getElementById('lmImportDoBtn').disabled=true; }
    }
  });
  container.addEventListener('change', e=>{
    if(e.target.id==='lmFStatus'){ lmFilters.status = e.target.value; lmPage=1; lmRenderTable(); }
    if(e.target.id==='lmFRegion'){ lmFilters.region = e.target.value; lmPage=1; lmRenderTable(); }
    if(e.target.id==='lmFPart'){ lmFilters.part = e.target.value; lmPage=1; lmRenderTable(); }
    if(e.target.id==='lmFSort'){ lmSort = e.target.value; lmRenderTable(); }
    if(e.target.classList.contains('lm-cb') && e.target.dataset.lmchk){ lmToggleSelect(e.target.dataset.lmchk, e.target.checked); }
    if(e.target.id==='lmImportFile' && e.target.files[0]) lmReadImportFile(e.target.files[0]);
  });
}

      renderAdmin();
    });

function kyRenderKpi(){
  const el = document.getElementById('kyKpiRow');

  const views = productsCache.reduce((s,p)=>s+(p.views||0),0);
  const downloads = productsCache.reduce((s,p)=>s+(p.downloads||0),0);
  const avgRating = (()=>{ const rs = productsCache.map(p=>{ const r=ratingsCache[p.id]; return r&&r.count?r.sum/r.count:null; }).filter(x=>x!=null); return rs.length ? (rs.reduce((a,b)=>a+b,0)/rs.length).toFixed(1) : '—'; })();
  el.innerHTML = [
    ['Total Karya', total], ['Total Views', fmtNum(views)], ['Total Unduhan', fmtNum(downloads)], ['Rating Rata-rata', avgRating]
  ].map(([label,val])=>`<div class="ky-kpi"><b>${val}</b><span>${label}</span></div>`).join('');
}

function kyCloseImport(){ deactivateOverlay('kyImportOverlay'); }
function kyReadImportFile(file){
  const reader = new FileReader();
  const finish = (matrix)=>{
    const rows = matrix.slice(1).map(row=>({
      title:String(row[0]||'').trim(), seller:String(row[1]||'').trim(), type:(String(row[2]||'').trim()==='video')?'video':'foto',
      cat:String(row[3]||'').trim()||'Lainnya', region:String(row[4]||'').trim()||null, price:parseInt(row[5],10)||0,
      res:String(row[6]||'').trim(), format:String(row[7]||'').trim(), size:String(row[8]||'').trim(),
      desc:String(row[9]||'').trim(), downloadUrl:String(row[10]||'').trim(), img:String(row[11]||'').trim()
    })).filter(r=>r.title && r.seller);
    kyImportRows = rows;
    document.getElementById('kyImportPreview').textContent = rows.length ? `${rows.length} karya siap diimport.` : 'Tidak ada baris valid (Judul & Kreator wajib diisi).';
    document.getElementById('kyImportDoBtn').disabled = !rows.length;
  };
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(ext==='csv'){
    reader.onload = () => finish(reader.result.split(/\r?\n/).map(l=>l.split(',')));
    reader.readAsText(file);
  } else {
    reader.onload = () => {
      try{
        const wb = XLSX.read(new Uint8Array(reader.result), {type:'array'});
        finish(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1}));
      }catch(e){ toast('Gagal membaca file', 'error'); }
    };
    reader.readAsArrayBuffer(file);
  }
}
async function kyDoImport(){
  if(!kyImportRows || !kyImportRows.length) return;
  const now = Date.now();
  for(const r of kyImportRows){
    const id = 'p'+now.toString(36)+Math.random().toString(36).slice(2,8);
    productsCache.push({id, views:0, downloads:0, ts:now, ...r});
    await ensureRating(id, {sum:0,count:0});
  }
  await sSet('karya-products', productsCache, true);
  kyCloseImport();
  toast(`Import selesai — ${kyImportRows.length} karya ditambah`, 'success');
  renderHeadStats(); renderAdmin();
}

  const bulkDelBtn = document.getElementById('kyBulkDelBtn');
  if(bulkDelBtn) bulkDelBtn.onclick = kyBulkDelete;
  const exportBtn = document.getElementById('kyExportBtn');
  if(exportBtn) exportBtn.onclick = kyExportXlsx;
  const importBtn = document.getElementById('kyImportBtn');
  if(importBtn) importBtn.onclick = kyOpenImport;
  const importClose = document.getElementById('kyImportClose');
  const importCancel = document.getElementById('kyImportCancel');
  if(importClose) importClose.onclick = kyCloseImport;
  if(importCancel) importCancel.onclick = kyCloseImport;
  const importOverlay = document.getElementById('kyImportOverlay');
  if(importOverlay) importOverlay.onclick = (e)=>{ if(e.target===importOverlay) kyCloseImport(); };
  const importDrop = document.getElementById('kyImportDrop');
  const importFile = document.getElementById('kyImportFile');
  if(importDrop) importDrop.onclick = ()=>importFile && importFile.click();
  if(importFile) importFile.onchange = (e)=>{ if(e.target.files[0]) kyReadImportFile(e.target.files[0]); };
  const importDo = document.getElementById('kyImportDoBtn');
  if(importDo) importDo.onclick = kyDoImport;
}

/* ---------------- tab switching ---------------- */
/* ---------------- routing (deep-linkable URLs) ---------------- */
// Scope note: only top-level view + thread/product id are reflected in the URL.
// Filter/search state (category, type, forum search text) stays client-only —
// adding those to the URL too is a reasonable follow-up but not done here.
let activeProductId = null;

function computeHash(){
  if(activeTopTab==='forum' && activeThreadId) return '#/forum/'+encodeURIComponent(activeThreadId);
  if(activeTopTab==='karya' && activeProductId) return '#/karya/'+encodeURIComponent(activeProductId);
  if(activeTopTab==='karya' && activeCreatorHandle) return '#/creator/'+encodeURIComponent(activeCreatorHandle);
  return '#/'+activeTopTab;
}
function pushRoute(){
  const h = computeHash();
  if(location.hash !== h) history.pushState(null, '', h);
}
function renderActiveView(){
  document.querySelectorAll('.top-tab').forEach(b=>{
    const isActive = b.dataset.toptab===activeTopTab;
    b.classList.toggle('active', isActive);
    b.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });
  const showHome = activeTopTab==='karya' && !activeProductId && !activeCreatorHandle;
  const showProduct = activeTopTab==='karya' && !!activeProductId;
  const showCreator = activeTopTab==='karya' && !activeProductId && !!activeCreatorHandle;
  document.getElementById('layoutKarya').style.display = showHome ? '' : 'none';
  document.getElementById('layoutProduct').style.display = showProduct ? '' : 'none';
  document.getElementById('layoutCreator').style.display = showCreator ? '' : 'none';
  document.getElementById('layoutForum').style.display = activeTopTab==='forum' ? '' : 'none';
  document.getElementById('layoutTentang').style.display = activeTopTab==='tentang' ? '' : 'none';
  document.getElementById('layoutAdmin').style.display = activeTopTab==='admin' ? '' : 'none';
  document.getElementById('pageHead').style.display = activeTopTab==='karya' ? 'none' : '';
  if(showHome) renderHome();
  if(showProduct){
    const p = productsCache.find(x=>x.id===activeProductId);
    if(p) renderProductPage(p); else { activeProductId=null; renderActiveView(); return; }
  }
  if(showCreator) renderCreatorPage(activeCreatorHandle);
  if(activeTopTab==='forum') renderForum();
  if(activeTopTab==='admin') renderAdmin();
  updateDocumentTitle();
  // move focus to the page heading on navigation so screen reader / keyboard users
  // land somewhere meaningful instead of losing their place
  const heading = document.querySelector('#mainContent h1, #mainContent h2[tabindex]');
  if(heading && document.activeElement===document.body) { /* leave initial load alone */ }
}
function updateDocumentTitle(){
  const base = 'BILIK';
  if(activeTopTab==='forum' && activeThreadId){
    const th = threadsCache && threadsCache.find(x=>x.id===activeThreadId);
    document.title = th ? th.title+' · '+t('nav_forum')+' · '+base : base;
  } else if(activeTopTab==='karya' && activeProductId){
    const p = productsCache.find(x=>x.id===activeProductId);
    document.title = p ? p.title+' · '+t('nav_karya')+' · '+base : base;
  } else if(activeTopTab==='karya' && activeCreatorHandle){
    document.title = activeCreatorHandle+' · '+t('nav_karya')+' · '+base;
  } else {
    document.title = t('nav_'+activeTopTab)+' · '+base;
  }
}
function switchTab(tab){
  activeTopTab = tab;
  activeThreadId = null;
  activeProductId = null;
  activeCreatorHandle = null;
  renderActiveView();
  pushRoute();
  window.scrollTo({top:0});
}
function goThread(id){
  activeTopTab = 'forum'; activeThreadId = id; activeProductId = null; selectedQuotes = [];
  renderActiveView();
  pushRoute();
  window.scrollTo({top:0});
}
function backToThreadList(){
  activeThreadId = null;
  renderActiveView();
  pushRoute();
}
async function goProduct(id){
  activeProductId = id;
  activeCreatorHandle = null;
  activeProductTab = 'overview';
  const p = productsCache.find(x=>x.id===id);
  renderActiveView();
  pushRoute();
  window.scrollTo({top:0});
  if(p){
    p.views = (p.views||0)+1;
    await sSet('karya-products', productsCache, true);
    recentlyViewedCache = [id, ...recentlyViewedCache.filter(x=>x!==id)].slice(0,12);
    await sSet('recently-viewed', recentlyViewedCache, false);
  }
}
function goCreator(handle){
  activeCreatorHandle = handle;
  activeProductId = null;
  renderActiveView();
  pushRoute();
  window.scrollTo({top:0});
}
function applyRouteFromHash(){
  const hash = location.hash.replace(/^#\/?/, '');
  const [tabRaw, idRaw] = hash.split('/');
  if(tabRaw==='creator'){
    activeTopTab='karya'; activeCreatorHandle = idRaw?decodeURIComponent(idRaw):null; activeProductId=null;
    renderActiveView(); return;
  }
  const validTabs = ['karya','forum','tentang','admin'];
  let tab = validTabs.includes(tabRaw) ? tabRaw : 'karya';
  if(tab==='admin' && !adminMode) tab = 'karya';
  activeTopTab = tab;
  activeThreadId = (tab==='forum' && idRaw) ? decodeURIComponent(idRaw) : null;
  activeProductId = (tab==='karya' && idRaw) ? decodeURIComponent(idRaw) : null;
  activeCreatorHandle = null;
  selectedQuotes = [];
  renderActiveView();
}
window.addEventListener('popstate', applyRouteFromHash);

/* ---------------- events ---------------- */
document.addEventListener('click', (e)=>{
  const wishlistId = e.target.closest('[data-wishlist]')?.dataset.wishlist;
  if(wishlistId){ e.stopPropagation(); toggleWishlist(wishlistId).then(()=>{ renderKarya(); if(activeProductId===wishlistId) renderProductPage(productsCache.find(x=>x.id===wishlistId)); }); return; }
  const openId = e.target.closest('[data-open]')?.dataset.open;
  if(openId){ goProduct(openId); return; }
  const typeFilter = e.target.closest('[data-typefilter]')?.dataset.typefilter;
  if(typeFilter){ activeTypeFilter=typeFilter; renderKarya(); return; }
  const catFilter = e.target.closest('[data-catfilter]')?.dataset.catfilter;
  if(catFilter){ activeCat=catFilter; renderKarya(); return; }
  const forumCat = e.target.closest('[data-forumcat]')?.dataset.forumcat;
  if(forumCat){ activeForumCatFilter=forumCat; renderForum(); return; }
  const threadId = e.target.closest('[data-thread]')?.dataset.thread;
  if(threadId){ goThread(threadId); return; }
  const gotoTab = e.target.closest('[data-gototab]')?.dataset.gototab;
  if(gotoTab){ switchTab(gotoTab); window.scrollTo({top:0, behavior:'smooth'}); return; }
  const regionFilter = e.target.closest('[data-regionfilter]')?.dataset.regionfilter;
  if(regionFilter){ activeRegion=regionFilter; renderKarya(); return; }
  if(e.target === document.getElementById('supportOverlay')) deactivateOverlay('supportOverlay');
  if(e.target === document.getElementById('threadFormOverlay')) deactivateOverlay('threadFormOverlay');
  if(e.target === document.getElementById('searchOverlay')) deactivateOverlay('searchOverlay');
  if(e.target.closest('#openSupportBtn')) openSupportModal();
});
document.addEventListener('input', (e)=>{
  if(e.target && e.target.id==='karyaSearch'){ karyaSearchQuery = e.target.value; renderKarya(); }
});
document.getElementById('topTabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.top-tab');
  if(btn) switchTab(btn.dataset.toptab);
});
document.getElementById('searchTrigger').addEventListener('click', openSearchOverlay);
document.getElementById('notifBell').addEventListener('click', openNotifPanel);
document.addEventListener('keydown', (e)=>{
  if(e.key==='/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName) && !document.activeElement.isContentEditable){
    e.preventDefault();
    openSearchOverlay();
  }
});

/* ---------------- init ---------------- */
(async function init(){

  await initLang();
  await initTheme();
  await ensureKarya();
  for(const p of productsCache){ await ensureRating(p.id, p.seed); }
  await ensureForum();
  await ensureSupporters();
  await ensureBlocked();
  await ensureReports();
  await ensureMembership();
  await ensureLikes();
  await ensureFollows();
  await loadPersonalExtras();
  await ensureSession();
  syncAdminToggleVisibility();
  await ensureMaintenance();
  await ensureNotifications();
  await ensureWishlist();
  renderIdentityWidget();
  renderNotifBell();
  renderHeadStats();
  renderOfflineBanner();
  renderMaintenanceSplashIfNeeded();
  applyRouteFromHash();
})();

})();
